[package]
name = "apexbase"
version = "1.31.1"
edition = "2021"
authors = ["Birch Kwok <birchkwok@gmail.com>"]
description = "High-performance HTAP embedded database with Rust core"
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "apexbase"
path = "apexbase/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]
server = ["dep:pgwire", "dep:tokio", "dep:async-trait", "dep:futures", "dep:clap"]
flight = ["dep:arrow-flight", "dep:tonic", "dep:tokio", "dep:clap", "dep:futures"]

[dependencies]
# Python bindings with numpy support (optional — disabled for server binary)
pyo3 = { version = "0.22", features = ["multiple-pymethods"], optional = true }
numpy = { version = "0.22", optional = true }

# Memory-mapped I/O
memmap2 = "0.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
bincode = "1.3"

# Arrow for zero-copy data transfer
arrow = { version = "59", default-features = false, features = ["ipc", "ffi", "csv", "json"] }

# Parquet for import/export
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"
libc = "0.2"

# Concurrency
parking_lot = "0.12"
rayon = "1.10"
dashmap = "5.5"
arc-swap = "1.7"

# Checksums
crc32fast = "1.4"

# Byte order handling
byteorder = "1.5"

# Shared byte buffers (used for zero-copy Arrow Buffer interop)
bytes = "1.6"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Random number generation (for testing)
rand = "0.8"

# Regex for query parsing
regex = "1.10"
md5 = "0.7"

# Fast substring search
memchr = "2.7"

# Fast non-cryptographic hashing
ahash = "0.8"

# Fast float parsing for custom CSV parser
fast-float = "0.2"

# Bloom filter for fast membership testing
bloomfilter = "1.0"

# Cross-platform file locking
fs2 = "0.4"

# LZ4 compression (pure Rust, no C deps)
lz4_flex = "0.11"

# Zstd compression (default, higher ratio than LZ4)
zstd = "0.13"

# Lazy static initialization
once_cell = "1.19"

# ApexFTS primitives. The engine and on-disk format live in this repository.
roaring = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"

# ApexBase owns the process allocator instead of inheriting one from FTS.
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }

# JIT compilation for query expressions (Cranelift)
cranelift = "0.116"
cranelift-module = "0.116"
cranelift-jit = "0.116"
cranelift-native = "0.116"
target-lexicon = "0.13"

# PostgreSQL wire protocol server (optional — enabled for server binary)
pgwire = { version = "0.27", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

# Arrow Flight gRPC server (optional — enabled for flight binary)
arrow-flight = { version = "59", optional = true }
tonic = { version = "0.14", features = ["transport"], optional = true }

[[example]]
name = "bench_fts"
path = "examples/bench_fts.rs"

[[bin]]
name = "apexbase-server"
path = "apexbase/src/bin/server_main.rs"
required-features = ["server"]

[[bin]]
name = "apexbase-flight"
path = "apexbase/src/bin/flight_main.rs"
required-features = ["flight"]

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package.apexbase-server]
opt-level = 3
