<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">ApexBase — the embedded database for the agent era</title>
  <desc id="desc">ApexBase wordmark with SQL, full-text search, vector retrieval and agent memory, plus v2.0.0 benchmark highlights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061017"/>
      <stop offset="0.55" stop-color="#08211f"/>
      <stop offset="1" stop-color="#0b2f2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26a69a"/>
      <stop offset="1" stop-color="#7fe3d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#26a69a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#26a69a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7fe3d4" opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="220" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="220" rx="22" fill="url(#dots)"/>
  <circle cx="1080" cy="10" r="120" fill="url(#glow)" filter="url(#soft)"/>
  <rect x="1" y="1" width="1198" height="218" rx="21" fill="none" stroke="#26a69a" stroke-opacity="0.26"/>

  <text x="64" y="86" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="62" font-weight="900" letter-spacing="-1.5" fill="#f4fbfa">ApexBase</text>
  <text x="66" y="122" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#b9d7d3">The embedded database for the agent era</text>
  <text x="66" y="154" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" letter-spacing="0.3" fill="#58c9bb">SQL  ·  Full-text search  ·  Vector retrieval  ·  Agent memory</text>
  <rect x="66" y="172" width="430" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>

  <g transform="translate(760,38)">
    <rect width="376" height="144" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#7fe3d4" stroke-opacity="0.26"/>
    <text x="24" y="28" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#7fe3d4">PUBLIC BASELINE</text>

    <text x="24" y="68" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#ffffff">105/105</text>
    <text x="24" y="88" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#9fb8b5">tabular rows won</text>

    <text x="170" y="68" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#ffffff">6/6</text>
    <text x="170" y="88" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#9fb8b5">exact-vector rows won</text>

    <text x="24" y="120" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#dff5f1">One local file. No server.</text>
  </g>
</svg>
